name: Witnessed
description: The Truth and Nothing but the Truth
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Suite - Using compatible versions
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.3.5

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # UI/UX Enhancements
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # Image & Media
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  video_player: ^2.9.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  timeago: ^3.7.0

  # Navigation
  go_router: ^14.6.2

  # Forms & Validation
  flutter_form_builder: 10.2.0
  form_builder_validators: ^11.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Connectivity
  connectivity_plus: ^6.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Other Features
  url_launcher: ^6.3.1
  share_plus: ^10.1.1
  flutter_markdown_plus: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  faker: ^2.2.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  
